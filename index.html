<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小梅的近期可約時段｜日常陪伴・生活協助</title>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --primary: #6b8e78;
      --primary-dark: #52705d;
      --text: #333333;
      --subtext: #666666;
      --border: #e6e2dc;
      --highlight: #f2f6f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .header h1 {
      font-size: 1.35rem;
      color: var(--primary-dark);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.92rem;
      color: var(--subtext);
    }

    .notice-box {
      background: var(--highlight);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .notice-box strong {
      color: var(--primary-dark);
    }

    .calendar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    /* 手機自適應日曆容器 */
    .calendar-wrapper {
      position: relative;
      width: 100%;
      height: 540px;
      overflow: hidden;
      border-radius: 10px;
    }

    .calendar-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .booking-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .booking-card h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text);
    }

    .booking-card p {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .template-box {
      background: #f7f7f7;
      border: 1px dashed #cccccc;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.92rem;
      white-space: pre-line;
      margin-bottom: 12px;
      color: #222;
    }

    .btn-copy {
      display: block;
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background: var(--primary-dark);
    }

    .copy-msg {
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary-dark);
      margin-top: 8px;
      height: 20px;
    }

    @media (max-width: 480px) {
      .calendar-wrapper {
        height: 460px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 頂部標題 -->
    <div class="header">
      <h1>🌿 小梅的近期可約時段</h1>
      <p>日常陪伴・純粹傾聽・生活代勞（回應時間 09:00–23:00）</p>
    </div>

    <!-- 檢視說明 -->
    <div class="notice-box">
      <strong>📌 怎麼看空檔？</strong><br />
      日曆上顯示「忙碌／已預約」代表該時段已有安排，其餘空白時段皆可詢問。<br />
      ※ 純屬健康正向陪伴，謝絕越界要求及高風險代勞（如代領包裹、簽名、保證人）。
    </div>

    <!-- Google 日曆嵌入區塊 -->
    <div class="calendar-card">
      <div class="calendar-wrapper">
        <iframe
          src="https://calendar.google.com/calendar/embed?src=tz85595369193%40gmail.com&ctz=Asia%2FTaipei&showTitle=0&showPrint=0&showCalendars=0"
          frameborder="0"
          scrolling="no">
        </iframe>
      </div>
    </div>

    <!-- 一鍵複製預約格式 -->
    <div class="booking-card">
      <h2>💬 看好時間了嗎？複製格式回 LINE 密我！</h2>
      <p>點下方按鈕複製格式，回到 LINE 貼上並填寫後傳給我就好囉：</p>
      <div class="template-box" id="bookingTemplate">哈囉小梅！我想詢問預約：
・想約日期／時段：
・想做的事（聊聊／吃飯／看診／雜事代勞）：
・大概地點（或線上）：
・是否為急單：</div>
      <button class="btn-copy" onclick="copyTemplate()">📋 一鍵複製預約格式</button>
      <div class="copy-msg" id="copyMsg"></div>
    </div>
  </div>

  <script>
    function copyTemplate() {
      const text = document.getElementById("bookingTemplate").innerText;
      navigator.clipboard.writeText(text).then(() => {
        const msg = document.getElementById("copyMsg");
        msg.textContent = "✅ 已複製！快回到 LINE 聊天室貼上吧～";
        setTimeout(() => {
          msg.textContent = "";
        }, 3000);
      }).catch(() => {
        alert("複製失敗，請直接長按上方文字框手動複製喔！");
      });
    }
  </script>
</body>
</html>
